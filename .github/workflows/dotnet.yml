name: .NET CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
      id-token: write
      contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_WEBAPP_NAME: 'myapi-time-birupakhya'   
  AZURE_WEBAPP_URL: 'https://myapi-time-birupakhya-eke3dpavctbhb3h9.centralindia-01.azurewebsites.net'
  AZURE_WEBAPP_NAME_STAGING: 'myapi-time-birupakhya-staging'
  AZURE_WEBAPP_URL_STAGING: 'https://myapi-time-birupakhya-staging-bshhb8bagjh0d4hk.centralindia-01.azurewebsites.net'
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format MyApi.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "Vulnerable packages found"
            exit 1
          fi

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:"MarkdownSummaryGithub;TextSummary"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report

      - name: Publish
        run: dotnet publish src/MyApi.Api/MyApi.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ./publish

  deploy-staging:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: ${{ env.AZURE_WEBAPP_URL_STAGING }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: api-package
          path: ./publish

      - name : Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_STAGING }}
          package: ./publish

      
      - name: Smoke Test (Staging)
        run: |
          BASE="${{ env.AZURE_WEBAPP_URL_STAGING }}"

          ok=false
          for i in $(seq 1 20); do
            code=$(curl --silent --output /tmp/health.txt --write-out "%{http_code}" "$BASE/health")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=true; break; fi
            # 403 is not a startup delay; stop early and show why
            if [ "$code" = "403" ]; then break; fi
            sleep 15
          done

          if [ "$ok" != "true" ]; then
            echo "Health check failed. Last response body:"
            head -c 1500 /tmp/health.txt
            echo
            exit 1
          fi

          code=$(curl --silent --output /dev/null --write-out "%{http_code}" "$BASE/api/favorites")
          [ "$code" = "401" ] || { echo "Expected 401 from /api/favorites, got $code"; exit 1; }

          echo "Staging smoke tests passed."


  deploy-production:
    needs: deploy-staging
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.AZURE_WEBAPP_URL }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: api-package
          path: ./publish

      - name : Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke Test (Production)
        run: |
          BASE="${{ env.AZURE_WEBAPP_URL }}"

          ok=false
          for i in $(seq 1 20); do
            code=$(curl --silent --output /tmp/health.txt --write-out "%{http_code}" "$BASE/health")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=true; break; fi
            # 403 is not a startup delay; stop early and show why
            if [ "$code" = "403" ]; then break; fi
            sleep 15
          done

          if [ "$ok" != "true" ]; then
            echo "Health check failed. Last response body:"
            head -c 1500 /tmp/health.txt
            echo
            exit 1
          fi

          code=$(curl --silent --output /dev/null --write-out "%{http_code}" "$BASE/api/favorites")
          [ "$code" = "401" ] || { echo "Expected 401 from /api/favorites, got $code"; exit 1; }

          echo "Production smoke tests passed."