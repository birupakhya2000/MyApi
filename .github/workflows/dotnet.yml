name: .NET CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
      id-token: write
      contents: read

env:
  AZURE_WEBAPP_NAME: 'myapi-time-birupakhya'   
  AZURE_WEBAPP_URL: 'https://myapi-time-birupakhya-eke3dpavctbhb3h9.centralindia-01.azurewebsites.net'
  AZURE_WEBAPP_NAME_STAGING: 'myapi-time-birupakhya-staging'
  AZURE_WEBAPP_URL_STAGING: 'myapi-time-birupakhya-staging-bshhb8bagjh0d4hk.centralindia-01.azurewebsites.net'
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/MyApi.Api/MyApi.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ./publish

  deploy-staging:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: ${{ env.AZURE_WEBAPP_URL_STAGING }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./publish

      - name : Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_STAGING }}
          package: ./publish

      
      - name: Smoke Test (Staging)
        run: |
          set -e

          # Verify health endpoint
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            "${{ env.AZURE_WEBAPP_URL_STAGING }}/health"

          # Verify protected endpoint returns 401
          code=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            "${{ env.AZURE_WEBAPP_URL_STAGING }}/api/favorites")

          if [ "$code" != "401" ]; then
            echo "Expected HTTP 401 from /api/favorites, got $code"
            exit 1
          fi

          echo "Staging smoke tests passed."


  deploy-production:
    needs: deploy-staging
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.AZURE_WEBAPP_URL }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./publish

      - name : Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke Test (Staging)
        run: |
          set -e

          # Verify health endpoint
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            "${{ env.AZURE_WEBAPP_URL_STAGING }}/health"

          # Verify protected endpoint returns 401
          code=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            "${{ env.AZURE_WEBAPP_URL_STAGING }}/api/favorites")

          if [ "$code" != "401" ]; then
            echo "Expected HTTP 401 from /api/favorites, got $code"
            exit 1
          fi

          echo "Staging smoke tests passed."