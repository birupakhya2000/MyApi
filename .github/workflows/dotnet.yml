name: .NET CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
      id-token: write
      contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_WEBAPP_NAME: 'myapi-time-birupakhya'   
  AZURE_WEBAPP_URL: 'https://myapi-time-birupakhya-eke3dpavctbhb3h9.centralindia-01.azurewebsites.net'
  AZURE_WEBAPP_NAME_STAGING: 'myapi-time-birupakhya-staging'
  AZURE_WEBAPP_URL_STAGING: 'https://myapi-time-birupakhya-staging-bshhb8bagjh0d4hk.centralindia-01.azurewebsites.net'
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format MyApi.slnx --verify-no-changes --no-restore

      - name: Build
        run: >
          dotnet build --configuration Release --no-restore
          -p:Version=1.0.${{ github.run_number }}
          -p:InformationalVersion=1.0.${{ github.run_number }}+${{ github.sha }}
      
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "Vulnerable packages found"
            exit 1
          fi

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:"MarkdownSummaryGithub;TextSummary"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report

      - name: Publish
        run: dotnet publish src/MyApi.Api/MyApi.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: api-package
          path: ./publish

  deploy-staging:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: ${{ env.AZURE_WEBAPP_URL_STAGING }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./publish

      - name : Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_STAGING }}
          package: ./publish

      
      - name: Smoke Test (Staging)
        run: |
          BASE="${{ env.AZURE_WEBAPP_URL_STAGING }}"

          ok=false
          for i in $(seq 1 20); do
            code=$(curl --silent --output /tmp/health.txt --write-out "%{http_code}" "$BASE/health")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=true; break; fi
            # 403 is not a startup delay; stop early and show why
            if [ "$code" = "403" ]; then break; fi
            sleep 15
          done

          # Readiness: the app can reach its database (retries cover the free DB waking up)
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            "$BASE/health/ready"
          echo

          # The version we just built must be the one serving traffic
          ok=false
          for i in $(seq 1 12); do
            if curl --silent "$BASE/version" | grep -q "1.0.${{ github.run_number }}"; then ok=true; break; fi
            sleep 15
          done
          $ok || { echo "Expected version 1.0.${{ github.run_number }} is not live"; exit 1; }

          if [ "$ok" != "true" ]; then
            echo "Health check failed. Last response body:"
            head -c 1500 /tmp/health.txt
            echo
            exit 1
          fi

          code=$(curl --silent --output /dev/null --write-out "%{http_code}" "$BASE/api/favorites")
          [ "$code" = "401" ] || { echo "Expected 401 from /api/favorites, got $code"; exit 1; }

          echo "Staging smoke tests passed."


  deploy-production:
    needs: deploy-staging
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.AZURE_WEBAPP_URL }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./publish

      - name : Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke Test (Production)
        run: |
          BASE="${{ env.AZURE_WEBAPP_URL }}"

          ok=false
          for i in $(seq 1 20); do
            code=$(curl --silent --output /tmp/health.txt --write-out "%{http_code}" "$BASE/health")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=true; break; fi
            # 403 is not a startup delay; stop early and show why
            if [ "$code" = "403" ]; then break; fi
            sleep 15
          done

          # Readiness: the app can reach its database (retries cover the free DB waking up)
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            "$BASE/health/ready"
          echo

          # The version we just built must be the one serving traffic
          ok=false
          for i in $(seq 1 12); do
            if curl --silent "$BASE/version" | grep -q "1.0.${{ github.run_number }}"; then ok=true; break; fi
            sleep 15
          done
          $ok || { echo "Expected version 1.0.${{ github.run_number }} is not live"; exit 1; }

          if [ "$ok" != "true" ]; then
            echo "Health check failed. Last response body:"
            head -c 1500 /tmp/health.txt
            echo
            exit 1
          fi

          code=$(curl --silent --output /dev/null --write-out "%{http_code}" "$BASE/api/favorites")
          [ "$code" = "401" ] || { echo "Expected 401 from /api/favorites, got $code"; exit 1; }

          echo "Production smoke tests passed."

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/birupakhya2000/myapi   # image names must be lowercase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t myapi:ci .

      - name: Run container and smoke test
        run: |
          docker run -d --name myapi -p 8080:8080 \
            -e Jwt__Key="ci-only-key-ci-only-key-ci-only-key-123456" \
            -e Database__Provider=Sqlite \
            -e "ConnectionStrings__Default=Data Source=/tmp/app.db" \
            myapi:ci

          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/health
          echo

          # Time zone data must exist inside the image
          curl --fail --silent --show-error http://localhost:8080/api/time/Asia/Kolkata
          echo

          # Auth must be enforced
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/favorites)
          [ "$code" = "401" ] || { echo "Expected 401, got $code"; exit 1; }

      - name: Show container logs on failure
        if: failure()
        run: docker logs myapi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          docker tag myapi:ci "$IMAGE_NAME:${{ github.sha }}"
          docker tag myapi:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  release:
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the tag and release

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./publish

      - name: Zip package
        run: cd publish && zip -qr ../api-package.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v$VERSION" api-package.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --generate-notes

  rollback:
    needs: deploy-production
    if: always() && needs.deploy-production.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: Production
      url: ${{ env.AZURE_WEBAPP_URL }}

    steps:
      - name: Download the last released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rollback
          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "api-package.zip" \
            --dir rollback || { echo "No previous release exists, nothing to roll back to."; exit 1; }
          unzip -q rollback/api-package.zip -d publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Redeploy previous version to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Verify rollback
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            "${{ env.AZURE_WEBAPP_URL }}/health"
          echo
          echo "### Production was rolled back to the previous release" >> "$GITHUB_STEP_SUMMARY"

  bicep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

